<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Effect</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      cursor: crosshair;
    }
    video { display: none; }
    canvas {
      width: 100vw;
      height: 100vh;
      transform: scaleX(-1);
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <video id="vid" playsinline></video>
  <canvas id="c"></canvas>

  <script>
    var vid = document.getElementById('vid');
    var c = document.getElementById('c');
    var ctx = c.getContext('2d');

    var arr = [];
    var cur = [];
    var isDrawingMode = true; // Auto draw enabled by default
    var isDrawingNow = false;
    var sx = null;
    var sy = null;

    // Space to clear canvas
    window.onkeydown = function(e) {
      if (e.code === 'Space') {
        arr = [];
        cur = [];
        isDrawingNow = false;
      }
      if (e.key === 'Shift') {
        isDrawingMode = true;
      }
    };

    window.onkeyup = function(e) {
      if (e.key === 'Shift') {
        // keep drawing mode state unless toggled
      }
    };

    // Click anywhere to toggle drawing ON / OFF
    window.onclick = function() {
      isDrawingMode = !isDrawingMode;
      if (!isDrawingMode) {
        isDrawingNow = false;
      }
    };

    function run(res) {
      c.width = window.innerWidth;
      c.height = window.innerHeight;

      // 1. Draw crisp camera feed
      ctx.drawImage(res.image, 0, 0, c.width, c.height);

      // 2. Light dark vignette so face remains bright & clear (not pitch black)
      ctx.fillStyle = 'rgba(10, 6, 2, 0.4)';
      ctx.fillRect(0, 0, c.width, c.height);

      // 3. Draw accumulated lines with golden glow
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = 18;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (var i = 0; i < arr.length; i++) {
        ctx.beginPath();
        for (var j = 0; j < arr[i].length; j++) {
          if (j === 0) ctx.moveTo(arr[i][j].x, arr[i][j].y);
          else ctx.lineTo(arr[i][j].x, arr[i][j].y);
        }
        ctx.stroke();
      }

      // Reset shadow blur for fast mesh rendering
      ctx.shadowBlur = 0;

      if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
        var lm = res.multiFaceLandmarks[0];

        // Fast, high-FPS Golden Face Contours (No lag)
        drawConnectors(ctx, lm, FACEMESH_FACE_OVAL, {color: 'rgba(245, 208, 97, 0.85)', lineWidth: 2});
        drawConnectors(ctx, lm, FACEMESH_RIGHT_EYE, {color: '#FFD700', lineWidth: 2});
        drawConnectors(ctx, lm, FACEMESH_LEFT_EYE, {color: '#FFD700', lineWidth: 2});
        drawConnectors(ctx, lm, FACEMESH_RIGHT_EYEBROW, {color: 'rgba(245, 208, 97, 0.75)', lineWidth: 2});
        drawConnectors(ctx, lm, FACEMESH_LEFT_EYEBROW, {color: 'rgba(245, 208, 97, 0.75)', lineWidth: 2});
        drawConnectors(ctx, lm, FACEMESH_LIPS, {color: 'rgba(255, 140, 160, 0.85)', lineWidth: 2});

        // Delicate inner mesh lines for elegant cyber/Ramadan look
        drawConnectors(ctx, lm, FACEMESH_TESSELATION, {color: 'rgba(245, 208, 97, 0.15)', lineWidth: 0.8});

        // Nose pointer (Landmark 4)
        var nose = lm[4] || lm[1];
        var rx = nose.x * c.width;
        var ry = nose.y * c.height;

        // Smooth nose movement
        if (sx === null) {
          sx = rx;
          sy = ry;
        } else {
          sx += (rx - sx) * 0.5;
          sy += (ry - sy) * 0.5;
        }

        // Glowing Pointer at Nose Tip
        ctx.shadowColor = isDrawingMode ? '#FFFFFF' : '#FFD700';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, 2 * Math.PI);
        ctx.fillStyle = isDrawingMode ? '#FFFFFF' : 'rgba(245, 208, 97, 0.6)';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw when active
        if (isDrawingMode) {
          if (!isDrawingNow) {
            isDrawingNow = true;
            cur = [];
            arr.push(cur);
          }
          cur.push({x: sx, y: sy});
        } else {
          isDrawingNow = false;
        }
      } else {
        isDrawingNow = false;
        sx = null;
      }
    }

    var faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false, // Turned off for maximum FPS
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(run);

    var cam = new Camera(vid, {
      onFrame: async () => { await faceMesh.send({image: vid}); },
      width: 1280,
      height: 720
    });

    cam.start();
  </script>
</body>
</html>
